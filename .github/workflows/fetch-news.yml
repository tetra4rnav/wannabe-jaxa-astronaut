name: Fetch news

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch feeds and official X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: npm run fetch:news
      - name: Rebuild corpus
        run: npm run corpus:build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json public/corpus
          if git diff --staged --quiet; then
            echo "No news changes"
          else
            git commit -m "chore: update news.json from scheduled fetch"
            git push
          fi
