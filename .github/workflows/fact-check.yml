name: Weekly fact-check

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  factcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Domain audit
        run: npm run wiki:audit
      - name: LLM fact-check (Workers AI)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ secrets.CF_AI_MODEL }}
        run: npm run fact-check
      - name: Rebuild corpus
        run: npm run corpus:build
      - name: Commit if changed
        run: |
          if [ -z "${{ secrets.CF_ACCOUNT_ID }}" ] || [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "Workers AI secrets unset — nothing to commit from fact-check"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fact-checks public/corpus
          if git diff --staged --quiet; then
            echo "No fact-check changes"
          else
            git commit -m "chore: append weekly fact-check history"
            git push
          fi
